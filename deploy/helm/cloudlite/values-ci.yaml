# CI-only fixture, originally added to satisfy this chart's Helm
# `required()` guards for helm lint/template in CI. As of the ArgoCD
# sub-project those guards no longer exist (the chart's real secrets
# are SealedSecrets, not Helm values) — this file is kept only because
# .github/workflows/ci-helm.yml still passes it via `-f`. The values
# below are now inert; never use them for a real install regardless.
postgres:
  password: "ci-lint-placeholder"
iam:
  jwt:
    secret: "ci-lint-placeholder-at-least-32-bytes-long"
