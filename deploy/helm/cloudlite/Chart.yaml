apiVersion: v2
name: cloudlite
description: CloudLite platform — S3 + IAM clone, self-hosted on k3s
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: iam
    version: "0.1.0"
    repository: "file://charts/iam"
  - name: s3
    version: "0.1.0"
    repository: "file://charts/s3"
  - name: prometheus
    version: "29.27.0"
    repository: "https://prometheus-community.github.io/helm-charts"
  - name: loki
    version: "7.3.0"
    repository: "https://grafana.github.io/helm-charts"
  - name: alloy
    version: "1.12.1"
    repository: "https://grafana.github.io/helm-charts"
  - name: grafana
    version: "10.5.15"
    repository: "https://grafana.github.io/helm-charts"
