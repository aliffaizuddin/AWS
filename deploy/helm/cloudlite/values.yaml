global:
  postgres:
    database: cloudlite
    username: cloudlite

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 10Gi
    storageClassName: fast-ssd

s3:
  replicaCount: 1
  image:
    repository: s3
    tag: "0.1.0"

iam:
  replicaCount: 1
  image:
    repository: iam
    tag: "0.1.0"

prometheus:
  server:
    global:
      scrape_interval: 15s
    persistentVolume:
      size: 8Gi
      storageClass: bulk-hdd
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi
  configmapReload:
    prometheus:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 25m
          memory: 32Mi
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    storage:
      type: filesystem
    useTestSchema: true
    commonConfig:
      replication_factor: 1
  singleBinary:
    replicas: 1
    persistence:
      size: 8Gi
      storageClass: bulk-hdd
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 300m
        memory: 384Mi
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  # The loki chart's default resultsCache/chunksCache memcached sidecars
  # request ~1Gi/~8Gi respectively (production HA sizing for multi-tenant
  # Loki at scale) — this project's real target is a single 12GB
  # bare-metal node (docs/architecture.md §2, §8), so leaving these
  # enabled would OOM a real deployment the same way it starved a k3d
  # validation cluster. Disable them; SingleBinary mode works fine
  # without them at this project's scale.
  resultsCache:
    enabled: false
  chunksCache:
    enabled: false
  test:
    enabled: false
  # Memory below is higher than a first-pass guess (10m/16Mi req,
  # 25m/32Mi limit) would suggest: live k3d verification showed the
  # kiwigrid/k8s-sidecar 2.5.0 image (loki-sc-rules) settles at a
  # steady-state ~70Mi RSS, not a transient startup spike — a 32Mi
  # limit OOMKilled it in a persistent crash loop. 100Mi gives ~40%
  # headroom over the observed steady state.
  sidecar:
    resources:
      requests:
        cpu: 15m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 100Mi
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

alloy:
  alloy:
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
        }

        local.file_match "pods" {
          path_targets = discovery.relabel.pods.output
        }

        loki.source.file "pods" {
          targets    = local.file_match.pods.targets
          forward_to = [loki.process.pods.receiver]
        }

        loki.process "pods" {
          stage.cri {}

          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://cloudlite-loki:3100/loki/api/v1/push"
          }
        }
    mounts:
      varlog: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi
  configReloader:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 25m
        memory: 32Mi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  testFramework:
    enabled: false
  sidecar:
    datasources:
      enabled: true
    dashboards:
      enabled: true
    # Memory below is higher than a first-pass guess (25m/32Mi req,
    # 50m/64Mi limit) would suggest: live k3d verification showed each
    # kiwigrid/k8s-sidecar 2.5.0 container (grafana-sc-dashboard,
    # grafana-sc-datasources) settles at a steady-state ~76-77Mi RSS,
    # not a transient startup spike — a 64Mi limit OOMKilled both in a
    # persistent crash loop. 100Mi gives headroom over the observed
    # steady state.
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 100Mi
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 150m
      memory: 192Mi
