global:
  postgres:
    database: cloudlite
    username: cloudlite

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 10Gi
    storageClassName: fast-ssd

s3:
  replicaCount: 1
  image:
    repository: s3
    tag: "0.1.0"

iam:
  replicaCount: 1
  image:
    repository: iam
    tag: "0.1.0"

prometheus:
  server:
    persistentVolume:
      size: 8Gi
      storageClass: bulk-hdd
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
