global:
  postgres:
    database: cloudlite
    username: cloudlite

postgres:
  image:
    repository: postgres
    tag: "16-alpine"
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  persistence:
    size: 10Gi
    storageClassName: fast-ssd

s3:
  replicaCount: 1
  image:
    repository: s3
    tag: "0.1.0"

iam:
  replicaCount: 1
  image:
    repository: iam
    tag: "0.1.0"

prometheus:
  server:
    persistentVolume:
      size: 8Gi
      storageClass: bulk-hdd
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false

loki:
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    storage:
      type: filesystem
    useTestSchema: true
  singleBinary:
    replicas: 1
    persistence:
      size: 8Gi
      storageClass: bulk-hdd
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        cpu: 300m
        memory: 384Mi
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

alloy:
  alloy:
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            target_label  = "__path__"
            replacement   = "/var/log/pods/*$1/*.log"
          }
        }

        loki.source.file "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://cloudlite-loki:3100/loki/api/v1/push"
          }
        }
    mounts:
      varlog: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 128Mi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    datasources:
      enabled: true
    dashboards:
      enabled: true
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 150m
      memory: 192Mi
