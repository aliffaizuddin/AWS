name: CI - Java service (reusable)

on:
  workflow_call:
    inputs:
      service-name:
        description: "Short service name (e.g. s3, iam)"
        required: true
        type: string
      service-path:
        description: "Path to the service's Maven project (e.g. services/s3)"
        required: true
        type: string
      image-name:
        description: "Fully-qualified image name without a tag (e.g. ghcr.io/aliffaizuddin/aws/s3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    name: ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        working-directory: ${{ inputs.service-path }}
        run: mvn -B test

      - name: Compute short SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: short-sha
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service-path }}
          push: true
          tags: ${{ inputs.image-name }}:${{ steps.short-sha.outputs.sha }}
